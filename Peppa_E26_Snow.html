<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow · 中译英练习（46 句）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: min(100%, 720px); margin: 40px auto; padding: 0 20px 36px; background: #f4f7fb; color: #202938; }
  .home-link { display: inline-flex; align-items: center; gap: 9px; margin: 0 0 18px -4px; padding: 4px 8px 4px 4px; border-radius: 999px; color: #667085; font-size: 14px; font-weight: 600; text-decoration: none; transition: color .2s, background .2s; }
  .home-link:hover { background: #eaf2fc; color: #3478c9; }
  .home-icon { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #e8edf4; border-radius: 50%; background: #fff; color: #3478c9; font-size: 18px; line-height: 1; box-shadow: 0 2px 6px rgba(31,50,81,.06); transition: transform .2s, box-shadow .2s; }
  .home-link:hover .home-icon { transform: translateX(-2px); box-shadow: 0 3px 9px rgba(31,50,81,.1); }
  .home-link:focus-visible { outline: 3px solid rgba(52,120,201,.28); outline-offset: 2px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .subtitle { color: #667085; font-size: 14px; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid #e8edf4; border-radius: 16px; padding: 28px; box-shadow: 0 8px 28px rgba(31,50,81,.08); }
  .progress-row { display: flex; justify-content: space-between; color: #667085; font-size: 14px; margin-bottom: 10px; }
  .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-bottom: 16px; }
  .order-control { display: inline-flex; gap: 3px; padding: 4px; border: 1px solid #e4e7ec; border-radius: 11px; background: #f8fafc; }
  .order-option { position: relative; cursor: pointer; }
  .order-option input { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  .order-option span { display: block; padding: 8px 12px; border-radius: 8px; color: #667085; font-size: 13px; font-weight: 600; white-space: nowrap; transition: color .18s, background .18s, box-shadow .18s; }
  .order-option input:checked + span { background: #fff; color: #3478c9; box-shadow: 0 1px 3px rgba(16,24,40,.12); }
  .order-option input:focus-visible + span { outline: 3px solid rgba(52,120,201,.28); outline-offset: 2px; }
  .progress-track { height: 7px; background: #edf0f5; border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
  .progress-bar { height: 100%; width: 0; background: #4a90d9; transition: width .25s ease; }
  .prompt { font-size: 22px; font-weight: 600; margin-bottom: 8px; line-height: 1.5; overflow-wrap: anywhere; }
  .hint { color: #667085; font-size: 14px; margin-bottom: 16px; }
  input { width: 100%; font-size: 18px; padding: 12px 14px; border: 2px solid #d0d5dd; border-radius: 10px; outline: none; }
  input:focus { border-color: #4a90d9; }
  .buttons { margin-top: 18px; display: flex; align-items: stretch; gap: 10px; }
  button { min-height: 46px; font-size: 15px; font-weight: 600; padding: 11px 18px; border: none; border-radius: 9px; cursor: pointer; transition: opacity .2s, transform .2s, box-shadow .2s; }
  button:hover { opacity: .86; }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(52,120,201,.28); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .check { flex: 1; background: #3478c9; color: #fff; }
  .check.next-action { background: #1a9c4b; }
  .skip, .restart { background: #edf0f5; color: #344054; }
  .result { margin-top: 16px; font-size: 18px; font-weight: 600; min-height: 24px; }
  .correct { color: #1a9c4b; }
  .wrong { color: #d33; }
  .answer { margin-top: 8px; font-size: 15px; color: #475467; line-height: 1.8; }
  .wrong-token { color: #b42318; background: #fee4e2; border-radius: 3px; padding: 1px 2px; text-decoration: underline wavy #d92d20; }
  .answer-label { display: block; margin-bottom: 4px; }
  .stats { margin-top: 18px; font-size: 14px; color: #667085; line-height: 1.8; }
  .answer { overflow-wrap: anywhere; }
  @media (max-width: 520px) {
    body { margin: 28px auto; padding: 0 16px 28px; }
    .home-link { margin-bottom: 14px; }
    h1 { font-size: clamp(19px, 5vw, 22px); line-height: 1.35; overflow-wrap: anywhere; }
    .subtitle { font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
    .card { padding: 18px 16px; border-radius: 14px; }
    .toolbar { justify-content: flex-start; margin-bottom: 14px; }
    .order-control { max-width: 100%; }
    .order-option span { padding: 8px 10px; font-size: 12px; }
    .progress-row { gap: 10px; font-size: 12px; }
    .progress-row span:last-child { text-align: right; }
    .progress-track { margin-bottom: 18px; }
    .prompt { font-size: 19px; line-height: 1.55; }
    .hint { font-size: 13px; line-height: 1.55; }
    input#answer { min-height: 48px; padding: 11px 12px; font-size: 16px; }
    .buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
    .buttons button { width: 100%; min-width: 0; min-height: 44px; padding: 10px 8px; font-size: 14px; }
    .check { grid-column: 1 / -1; }
    .result { font-size: 16px; line-height: 1.5; }
    .answer { font-size: 14px; }
    .stats { font-size: 13px; }
  }
</style>
</head>
<body>
<a class="home-link" href="index.html"><span class="home-icon" aria-hidden="true">‹</span><span>练习目录</span></a>
<h1>Snow · 中译英练习（46 句）</h1>
<p class="subtitle">看中文回忆英文，按自己的节奏完成每一道题。</p>
<div class="card">
  <div class="toolbar">
    <div class="order-control" role="radiogroup" aria-label="题目顺序">
      <label class="order-option"><input type="radio" name="orderMode" value="original" checked onchange="changeOrder()"><span>原文顺序</span></label>
      <label class="order-option"><input type="radio" name="orderMode" value="shuffle" onchange="changeOrder()"><span>随机顺序</span></label>
    </div>
  </div>
  <div class="progress-row"><span id="questionCount"></span><span id="progressText"></span></div>
  <div class="progress-track" id="progressTrack" role="progressbar" aria-label="已完成题目" aria-valuemin="0" aria-valuemax="46" aria-valuenow="0"><div class="progress-bar" id="progressBar"></div></div>
  <div class="prompt" id="prompt">加载中…</div>
  <div class="hint" id="hint"></div>
  <input id="answer" type="text" autocomplete="off" autofocus placeholder="在这里输入英文…">
  <div class="buttons">
    <button class="check" id="primaryButton" onclick="check()">检查（Enter）</button>
    <button class="skip" onclick="skip()">跳过</button>
    <button class="restart" onclick="restart()">重新开始</button>
  </div>
  <div class="result" id="result" role="status" aria-live="polite"></div>
  <div class="answer" id="answerText"></div>
</div>
<div class="stats" id="stats"></div>

<script>
const cards = [
  { prompt: "佩奇和乔治今天非常兴奋。", answers: ["Peppa and George are very excited today."] },
  { prompt: "因为外面下雪了！", answers: ["It is snowing outside!"] },
  { prompt: "妈妈，我们可以去玩雪吗？", answers: ["Mummy! Can we go and play in the snow?"] },
  { prompt: "可以，但是外面非常冷，所以你们必须穿暖和些。", answers: ["Yes, but it's very cold outside,so you must wrap up warm."] },
  { prompt: "好啊！", answers: ["Hurray!"] },
  { prompt: "还有不要忘记戴上你们的帽子，围巾和手套。", answers: ["And don't forget to wear your hats,and scarves and gloves."] },
  { prompt: "外面天气非常冷。", answers: ["It is very cold outside."] },
  { prompt: "佩奇和乔治必须戴上他们的帽子围巾和手套。", answers: ["Peppa and George must wear their hats and scarves and gloves."] },
  { prompt: "快来，乔治！", answers: ["Come on, George!"] },
  { prompt: "佩奇和乔治在雪地里踩脚印。", answers: ["Peppa and George are making footprints in the snow."] },
  { prompt: "喔！", answers: ["Oops!"] },
  { prompt: "哦，糟糕！", answers: ["Oh, dear！"] },
  { prompt: "这一点也不好笑！", answers: ["It's not funny!"] },
  { prompt: "乔治，让我们来打雪仗吧！", answers: ["George, let's play snowballs!"] },
  { prompt: "佩奇做了个雪球。", answers: ["Peppa has made a snowball."] },
  { prompt: "佩奇和乔治玩得很开心。", answers: ["Peppa and George are having a lot of fun."] },
  { prompt: "乔治，快回来，你这小猪！", answers: ["George, come back, you little piggy!"] },
  { prompt: "啊！", answers: ["Arrgh!"] },
  { prompt: "哦，糟糕。也许这游戏玩得有点过火了。", answers: ["Oh, dear. Maybe this game is getting a little too rough."] },
  { prompt: "对不起，乔治。", answers: ["Sorry, George."] },
  { prompt: "乔治！让我们来堆雪人吧！", answers: ["George! Let's build a snowman!"] },
  { prompt: "佩奇和乔治在堆雪人。", answers: ["Peppa and George are making a snowman."] },
  { prompt: "首先，他们堆了身体。", answers: ["First, they make the body."] },
  { prompt: "乔治，这是雪人的身体了。", answers: ["George, this is the snowman's body."] },
  { prompt: "现在，他们在堆雪人的头。", answers: ["Now, they make the snowman's head."] },
  { prompt: "现在，他需要胳膊，眼睛和嘴巴！", answers: ["Now, he needs arms and eyes and a mouth!"] },
  { prompt: "乔治找了几根树枝来做雪人的胳膊。", answers: ["George has found some sticks for the snowman's arms."] },
  { prompt: "佩奇找了几块石头来做雪人的眼睛和嘴巴。", answers: ["Peppa has found some stones for the snowman's eyes and mouth."] },
  { prompt: "这是他的脸啦。", answers: ["This is his face."] },
  { prompt: "现在雪人需要一个鼻子。", answers: ["Now the snowman needs a nose."] },
  { prompt: "佩奇找了根胡萝卜来做雪人的鼻子。", answers: ["Peppa has got a carrot, to make the snowman's nose."] },
  { prompt: "雪人看上去很开心。", answers: ["The snowman looks very happy."] },
  { prompt: "但也许他有点冷。", answers: ["But maybe he is bit cold."] },
  { prompt: "雪人需要穿些衣服来保暖。", answers: ["The snowman needs some clothes to keep him warm."] },
  { prompt: "乔治找来了一些衣服来给雪人保暖！", answers: ["George has found some clothes to keep the snowman nice and warm!"] },
  { prompt: "雪人戴上了他的帽子围巾和手套。", answers: ["The snowman is wearing his hat and scarf and gloves."] },
  { prompt: "妈妈！爸爸！快来看看！", answers: ["Mummy! Daddy! Come and look!"] },
  { prompt: "妈妈戴着她的帽子，围巾和手套来了。", answers: ["Mummy Pig is wearing her hat and scarf and gloves."] },
  { prompt: "这是我见过的最好的雪人了！", answers: ["That is the best snowman I have ever seen!"] },
  { prompt: "猪爸爸看上去有点冷。", answers: ["Daddy Pig looks quite cold."] },
  { prompt: "他没有戴着他的帽子，围巾和手套。", answers: ["He isn't wearing his hat and scarf and gloves."] },
  { prompt: "爸爸，你为什么不戴上你的帽子，围巾和手套？", answers: ["Daddy, why aren't you wearing your hat and scarf and gloves?"] },
  { prompt: "我不知道他们跑哪去了！", answers: ["I don't know where they are!"] },
  { prompt: "我到处都找不到它们。", answers: ["I can't find them anywhere."] },
  { prompt: "我想我知道爸爸的帽子，围巾和手套在哪了", answers: ["I think I know where Daddy's hat, scarf and gloves are"] },
  { prompt: "猪爸爸的帽子，围巾和手套都在雪人身上！", answers: ["Daddy Pig's hat and scarf and gloves are on the snowman!"] },
];

function normalize(s) {
  return s.toLowerCase().replace(/['’]/g, "").replace(/\p{P}/gu, " ").replace(/\s+/g, " ").trim();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function highlightWrongWords(userAnswer, correctAnswer) {
  const wordPattern = /[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g;
  const userWords = [...userAnswer.matchAll(wordPattern)];
  const correctWords = [...correctAnswer.matchAll(wordPattern)];
  const rows = userWords.length + 1;
  const cols = correctWords.length + 1;
  const lcs = Array.from({ length: rows }, () => Array(cols).fill(0));

  for (let i = userWords.length - 1; i >= 0; i--) {
    for (let j = correctWords.length - 1; j >= 0; j--) {
      const userWord = userWords[i][0].toLowerCase();
      const correctWord = correctWords[j][0].toLowerCase();
      lcs[i][j] = userWord === correctWord
        ? lcs[i + 1][j + 1] + 1
        : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }

  const matches = [];
  let i = 0;
  let j = 0;
  while (i < userWords.length && j < correctWords.length) {
    if (userWords[i][0].toLowerCase() === correctWords[j][0].toLowerCase()) {
      matches.push([i, j]);
      i++;
      j++;
    } else if (lcs[i][j + 1] >= lcs[i + 1][j]) {
      j++;
    } else {
      i++;
    }
  }

  const wrongIndexes = new Set();
  const missingIndexes = new Set();
  let previousUser = -1;
  let previousCorrect = -1;
  for (const [matchedUser, matchedCorrect] of [...matches, [userWords.length, correctWords.length]]) {
    const userGap = matchedUser - previousUser - 1;
    const correctGap = matchedCorrect - previousCorrect - 1;
    const pairedGap = Math.min(userGap, correctGap);
    for (let offset = 0; offset < pairedGap; offset++) {
      wrongIndexes.add(previousUser + 1 + offset);
      missingIndexes.add(previousCorrect + 1 + offset);
    }
    for (let offset = pairedGap; offset < userGap; offset++) {
      wrongIndexes.add(previousUser + 1 + offset);
    }
    for (let offset = pairedGap; offset < correctGap; offset++) {
      missingIndexes.add(previousCorrect + 1 + offset);
    }
    previousUser = matchedUser;
    previousCorrect = matchedCorrect;
  }

  let result = "";
  let lastIndex = 0;
  userWords.forEach((match, index) => {
    const start = match.index;
    const end = start + match[0].length;
    result += escapeHtml(userAnswer.slice(lastIndex, start));
    const word = escapeHtml(match[0]);
    result += wrongIndexes.has(index) ? `<mark class="wrong-token">${word}</mark>` : word;
    lastIndex = end;
  });
  result += escapeHtml(userAnswer.slice(lastIndex));

  let correctResult = "";
  lastIndex = 0;
  correctWords.forEach((match, index) => {
    const start = match.index;
    const end = start + match[0].length;
    correctResult += escapeHtml(correctAnswer.slice(lastIndex, start));
    const word = escapeHtml(match[0]);
    correctResult += missingIndexes.has(index) ? `<mark class="wrong-token">${word}</mark>` : word;
    lastIndex = end;
  });
  correctResult += escapeHtml(correctAnswer.slice(lastIndex));
  return { user: result, correct: correctResult };
}

let queue = [];
let current = null;
let stats = { correct: 0, wrong: 0, skipped: 0, total: 0 };
let locked = false;
let awaitingNext = false;
let currentOrderMode = "original";

function setPrimaryAction(action) {
  const button = document.getElementById("primaryButton");
  awaitingNext = action === "next";
  button.classList.toggle("next-action", awaitingNext);
  button.textContent = awaitingNext ? "下一题" : action === "done" ? "本轮完成" : "检查（Enter）";
  button.onclick = action === "next" ? nextCard : check;
  button.disabled = action === "done";
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function resetQueue() {
  queue = cards.map((c, i) => i);
  if (document.querySelector('input[name="orderMode"]:checked').value === "shuffle") {
    shuffle(queue);
  }
  stats = { correct: 0, wrong: 0, skipped: 0, total: 0 };
  locked = false;
}

function nextCard() {
  if (queue.length === 0) {
    current = null;
    document.getElementById("prompt").textContent = "🎉 本轮完成！";
    document.getElementById("hint").textContent = "";
    document.getElementById("answer").style.display = "none";
    setPrimaryAction("done");
    document.querySelector(".skip").disabled = true;
    document.getElementById("questionCount").textContent = `已完成 ${cards.length} / ${cards.length} 题`;
    document.getElementById("progressText").textContent = "100%";
    document.getElementById("progressBar").style.width = "100%";
    document.getElementById("progressTrack").setAttribute("aria-valuenow", cards.length);
    document.getElementById("result").textContent = "";
    document.getElementById("answerText").textContent = "";
    document.getElementById("stats").textContent =
      `本轮答对 ${stats.correct}，答错 ${stats.wrong}，跳过 ${stats.skipped}；共提交 ${stats.total} 次。`;
    return;
  }
  locked = false;
  setPrimaryAction("check");
  current = cards[queue[0]];
  const completed = cards.length - queue.length;
  const percent = Math.round(completed / cards.length * 100);
  document.getElementById("questionCount").textContent = `已完成 ${completed} / ${cards.length} 题`;
  document.getElementById("progressText").textContent = `${percent}%`;
  document.getElementById("progressBar").style.width = `${percent}%`;
  document.getElementById("progressTrack").setAttribute("aria-valuenow", completed);
  document.querySelector(".skip").disabled = false;
  document.getElementById("prompt").textContent = current.prompt;
  document.getElementById("hint").textContent = "请输入对应的英文";
  document.getElementById("answer").style.display = "";
  document.getElementById("answer").value = "";
  document.getElementById("answer").focus();
  document.getElementById("result").textContent = "";
  document.getElementById("answerText").textContent = "";
}

function check() {
  if (!current || locked) return;
  const input = document.getElementById("answer").value;
  if (!input.trim()) return;
  locked = true;
  document.querySelector(".skip").disabled = true;
  setPrimaryAction("next");
  const userNorm = normalize(input);
  const ok = current.answers.some(a => normalize(a) === userNorm);

  stats.total++;
  const resultEl = document.getElementById("result");
  const answerEl = document.getElementById("answerText");

  if (ok) {
    stats.correct++;
    resultEl.textContent = "✅ 正确";
    resultEl.className = "result correct";
    answerEl.textContent = "";
    queue.shift();
  } else {
    stats.wrong++;
    resultEl.textContent = "❌ 不对，再想想";
    resultEl.className = "result wrong";
    const comparison = highlightWrongWords(input, current.answers[0]);
    answerEl.innerHTML = `<span class="answer-label">你的答案：${comparison.user}</span>` +
      `<span class="answer-label">参考答案（标红为漏写/需改）：${comparison.correct}</span>`;
    const idx = queue.shift();
    queue.push(idx);
  }
  updateStats();
}

function skip() {
  if (!current || locked) return;
  locked = true;
  stats.skipped++;
  document.getElementById("result").textContent = "已跳过";
  document.getElementById("result").className = "result";
  document.getElementById("answerText").textContent = "参考答案：" + current.answers[0];
  const idx = queue.shift();
  queue.push(idx);
  updateStats();
  document.querySelector(".skip").disabled = true;
  setPrimaryAction("next");
}

function restart(confirmed = false) {
  if (!confirmed && (stats.correct || stats.wrong || stats.skipped) &&
      !window.confirm("重新开始将清空本轮进度和答题统计，并从第一题重新开始。确定继续吗？")) return;
  resetQueue();
  document.getElementById("answer").style.display = "";
  document.getElementById("stats").textContent = "";
  nextCard();
  updateStats();
}

function changeOrder() {
  const selectedMode = document.querySelector('input[name="orderMode"]:checked').value;
  const hasProgress = stats.correct > 0 || stats.wrong > 0 || stats.skipped > 0;
  if (hasProgress && !window.confirm("切换题目顺序会重新开始本轮，当前进度和统计将清零。要继续吗？")) {
    document.querySelector(`input[name="orderMode"][value="${currentOrderMode}"]`).checked = true;
    return;
  }
  currentOrderMode = selectedMode;
  restart(true);
}

function updateStats() {
  document.getElementById("stats").textContent =
    `已提交 ${stats.total} 次：答对 ${stats.correct}，答错 ${stats.wrong}，跳过 ${stats.skipped}`;
}

document.getElementById("answer").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    if (awaitingNext) nextCard();
    else check();
  }
});

resetQueue();
nextCard();
</script>
</body>
</html>
