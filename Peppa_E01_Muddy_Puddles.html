<p class="subtitle">看中文回忆英文，按自己的节奏完成每一道题。</p>
<div class="card">

<script>
const cards = [
  { prompt: "我是佩奇。", answers: ["I'm Peppa Pig."] },
  { prompt: "这是我的弟弟乔治。", answers: ["This is my little brother, George."] },

  { prompt: "所以佩奇和乔治不能在外边玩。", answers: ["So, Peppa and George cannot play outside."] },
  { prompt: "爸爸，现在雨停了。", answers: ["Daddy, it's stopped raining."] },
  { prompt: "我们能出去玩吗？", answers: ["Can we go out to play?"] },
  { prompt: "好的，你们两个去玩吧。", answers: ["Alright, run along you two."] },
  { prompt: "佩奇喜欢在泥坑里玩。", answers: ["Peppa loves jumping in muddy puddles."] },
  { prompt: "我喜欢在泥坑里玩。", answers: ["I love muddy puddles."] },
  { prompt: "佩奇，如果你要在泥坑里跳，你必须要穿上靴子才行。", answers: ["Peppa. lf you jump in muddy puddles, you must wear your boots."] },
  { prompt: "对不起，妈妈。", answers: ["Sorry, Mummy."] },
  { prompt: "乔治也喜欢在泥坑里跳。", answers: ["George likes to jump in muddy puddles, too."] },
  { prompt: "乔治，如果你想在泥坑里跳，你必须穿上靴子才行。", answers: ["George. If you jump in muddy puddles, you must wear your boots."] },
  { prompt: "佩奇喜欢照顾她的弟弟乔治。", answers: ["Peppa likes to look after her little brother, George."] },
  { prompt: "乔治，我们再去找几个泥坑跳吧。", answers: ["George, let's find some more puddles."] },
  { prompt: "佩奇和乔治玩得很开心。", answers: ["Peppa and George are having a lot of fun."] },
  { prompt: "佩奇找到了一个小泥坑。", answers: ["Peppa has found a little puddle."] },
  { prompt: "乔治找到了一个大泥坑。", answers: ["George has found a big puddle."] },
  { prompt: "你看，乔治。那里有一个很大的泥坑。", answers: ["Look, George. There's a really big puddle."] },
  { prompt: "乔治想第一个跳到泥坑里去玩。", answers: ["George wants to jump into the big puddle first."] },
  { prompt: "等一下，乔治。我得检查一下这里安不安全。", answers: ["Stop, George.l must check if it's safe for you."] },
  { prompt: "很好，你可以放心地玩啦。(对你很安全)", answers: ["Good. It is safe for you."] },
  { prompt: "对不起，乔治。只是些泥而已。", answers: ["Sorry, George. It's only mud."] },
  { prompt: "佩奇和乔治喜欢在泥坑里跳来跳去。", answers: ["Peppa and George love jumping in muddy puddles."] },
  { prompt: "走，乔治。我们去给爸爸看看。", answers: ["Come on, George. Let's go and show Daddy."] },
  { prompt: "我的老天呀。", answers: ["Goodness me."] },
  { prompt: "爸爸，爸爸，你猜猜我们刚才干了些什么。", answers: ["Daddy. Daddy.Guess what we've been doing."] },
  { prompt: "让我想一想。。。", answers: ["Let me think..."] },
  { prompt: "你们刚才看电视了？", answers: ["Have you been watching television?"] },
  { prompt: "不对，不对，爸爸。", answers: ["No. No. Daddy."] },
  { prompt: "你们刚才洗澡了？", answers: ["Have you just had a bath?"] },
  { prompt: "不对。不对。", answers: ["No. No."] },
  { prompt: "我知道了。你们刚才在泥坑里跳来跳去。", answers: ["I know. You've been jumping in muddy puddles."] },
  { prompt: "没错，没错，爸爸。我们刚才在泥坑里跳来跳去。", answers: ["Yes. Yes. Daddy. We've been jumping in muddy puddles."] },
  { prompt: "呵呵，看看你们弄得多脏呀。", answers: ["Ho. Ho. And look at the mess you're in."] },
  { prompt: "哦，没事，只是些泥而已。", answers: ["Oh, well, it's only mud."] },
  { prompt: "快清理干净，别让妈妈看到那么脏。（在妈妈看到前弄干净）", answers: ["Let's clean up quickly before Mummy sees the mess."] },
  { prompt: "爸爸，我们清理干净以后，你和妈妈也会一起来玩吗？", answers: ["Daddy, when we've cleaned up, will you and Mummy come and play, too?"] },
  { prompt: "是的，我们都可以在花园玩。", answers: ["Yes, we can all play in the garden."] },
  { prompt: "佩奇和乔治穿着他们的靴子。", answers: ["Peppa and George are wearing their boots."] },
  { prompt: "猪妈妈和猪爸爸也穿着他们的靴子。", answers: ["Mummy and Daddy are wearing their boots."] },
  { prompt: "佩奇喜欢在泥坑里跳来跳去。", answers: ["Peppa loves jumping up and down in muddy puddles."] },
  { prompt: "每个人都喜欢在泥坑里跳来跳去。", answers: ["Everyone loves jumping up and down in muddy puddles."] },
  { prompt: "哦，猪爸爸，瞧瞧你身上多脏呀。", answers: ["Oh, Daddy pig,look at the mess you're in."] },
  { prompt: "只是些泥而已。", answers: ["It’s only mud."] },
];

function normalize(s) {
  return s.toLowerCase().replace(/['’]/g, "").replace(/\p{P}/gu, " ").replace(/\s+/g, " ").trim();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function highlightWrongWords(userAnswer, correctAnswer) {
  const wordPattern = /[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g;
  const userWords = [...userAnswer.matchAll(wordPattern)];
  const correctWords = [...correctAnswer.matchAll(wordPattern)];
  const rows = userWords.length + 1;
  const cols = correctWords.length + 1;
  const lcs = Array.from({ length: rows }, () => Array(cols).fill(0));

  for (let i = userWords.length - 1; i >= 0; i--) {
    for (let j = correctWords.length - 1; j >= 0; j--) {
      const userWord = userWords[i][0].toLowerCase();
      const correctWord = correctWords[j][0].toLowerCase();
      lcs[i][j] = userWord === correctWord
        ? lcs[i + 1][j + 1] + 1
        : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }

  const matches = [];
  let i = 0;
  let j = 0;
  while (i < userWords.length && j < correctWords.length) {
    if (userWords[i][0].toLowerCase() === correctWords[j][0].toLowerCase()) {
      matches.push([i, j]);
      i++;
      j++;
    } else if (lcs[i][j + 1] >= lcs[i + 1][j]) {
      j++;
    } else {
      i++;
    }
  }

  const wrongIndexes = new Set();
  const missingIndexes = new Set();
  let previousUser = -1;
  let previousCorrect = -1;
  for (const [matchedUser, matchedCorrect] of [...matches, [userWords.length, correctWords.length]]) {
    const userGap = matchedUser - previousUser - 1;
    const correctGap = matchedCorrect - previousCorrect - 1;
    const pairedGap = Math.min(userGap, correctGap);
    for (let offset = 0; offset < pairedGap; offset++) {
      wrongIndexes.add(previousUser + 1 + offset);
      missingIndexes.add(previousCorrect + 1 + offset);
    }
    for (let offset = pairedGap; offset < userGap; offset++) {
      wrongIndexes.add(previousUser + 1 + offset);
    }
    for (let offset = pairedGap; offset < correctGap; offset++) {
      missingIndexes.add(previousCorrect + 1 + offset);
    }
    previousUser = matchedUser;
    previousCorrect = matchedCorrect;
  }

  let result = "";
  let lastIndex = 0;
  userWords.forEach((match, index) => {
    const start = match.index;
    const end = start + match[0].length;
    result += escapeHtml(userAnswer.slice(lastIndex, start));
    const word = escapeHtml(match[0]);
    result += wrongIndexes.has(index) ? `<mark class="wrong-token">${word}</mark>` : word;
    lastIndex = end;
  });
  result += escapeHtml(userAnswer.slice(lastIndex));

  let correctResult = "";
  lastIndex = 0;
  correctWords.forEach((match, index) => {
    const start = match.index;
    const end = start + match[0].length;
    correctResult += escapeHtml(correctAnswer.slice(lastIndex, start));
    const word = escapeHtml(match[0]);
    correctResult += missingIndexes.has(index) ? `<mark class="wrong-token">${word}</mark>` : word;
    lastIndex = end;
  });
  correctResult += escapeHtml(correctAnswer.slice(lastIndex));
  return { user: result, correct: correctResult };
}

let queue = [];
let wrongQueue = [];
let wrongSet = new Set();
let current = null;
let stats = { correct: 0, wrong: 0, skipped: 0, total: 0 };
let locked = false;
let awaitingNext = false;
let currentOrderMode = "original";
let phase = "main";
let reviewTotal = 0;

function setPrimaryAction(action) {
  const button = document.getElementById("primaryButton");
  awaitingNext = action === "next";
  button.classList.toggle("next-action", awaitingNext);
  button.textContent = awaitingNext ? "下一题" : action === "done" ? "本轮完成" : "检查（Enter）";
  button.onclick = action === "next" ? nextCard : check;
  button.disabled = action === "done";
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function resetQueue() {
  queue = cards.map((c, i) => i);
  if (document.querySelector('input[name="orderMode"]:checked').value === "shuffle") {
    shuffle(queue);
  }
  wrongQueue = [];
  wrongSet = new Set();
  stats = { correct: 0, wrong: 0, skipped: 0, total: 0 };
  locked = false;
  phase = "main";
  reviewTotal = 0;
}

function nextCard() {
  if (queue.length === 0) {
    if (phase === "main" && wrongQueue.length > 0) {
      phase = "review";
      queue = [...wrongQueue];
      reviewTotal = queue.length;
      nextCard();
      return;
    }
    current = null;
    document.getElementById("prompt").textContent = phase === "review" ? "🎉 错题复习完成！" : "🎉 本轮完成！";
    document.getElementById("hint").textContent = "";
    document.getElementById("answer").style.display = "none";
    setPrimaryAction("done");
    document.querySelector(".skip").disabled = true;
    document.getElementById("questionCount").textContent = phase === "review"
      ? `错题复习完成 ${reviewTotal} / ${reviewTotal} 题`
      : `已完成 ${cards.length} / ${cards.length} 题`;
    document.getElementById("progressText").textContent = "100%";
    document.getElementById("progressBar").style.width = "100%";
    document.getElementById("progressTrack").setAttribute("aria-valuemax", phase === "review" ? reviewTotal : cards.length);
    document.getElementById("progressTrack").setAttribute("aria-valuenow", phase === "review" ? reviewTotal : cards.length);
    document.getElementById("result").textContent = "";
    document.getElementById("answerText").textContent = "";
    document.getElementById("stats").textContent =
      `本轮答对 ${stats.correct}，答错 ${stats.wrong}，跳过 ${stats.skipped}；共提交 ${stats.total} 次。`;
    return;
  }
  locked = false;
  setPrimaryAction("check");
  current = cards[queue[0]];
  const completed = phase === "review" ? reviewTotal - queue.length : cards.length - queue.length;
  const total = phase === "review" ? reviewTotal : cards.length;
  const percent = Math.round(completed / total * 100);
  document.getElementById("questionCount").textContent = phase === "review"
    ? `错题复习：${completed} / ${reviewTotal} 题`
    : `已完成 ${completed} / ${cards.length} 题`;
  document.getElementById("progressText").textContent = `${percent}%`;
  document.getElementById("progressBar").style.width = `${percent}%`;
  document.getElementById("progressTrack").setAttribute("aria-valuemax", total);
  document.getElementById("progressTrack").setAttribute("aria-valuenow", completed);
  document.querySelector(".skip").disabled = false;
  document.getElementById("prompt").textContent = current.prompt;
  document.getElementById("hint").className = "hint";
  document.getElementById("hint").textContent = phase === "review"
    ? "新题已完成，请重新作答错题"
    : "请输入对应的英文";
  document.getElementById("answer").style.display = "";
  document.getElementById("answer").value = "";
  clearAnswerError();
  document.getElementById("answer").focus();
  document.getElementById("result").textContent = "";
  document.getElementById("answerText").textContent = "";
}

function check() {
  if (!current || locked) return;
  const input = document.getElementById("answer").value;
  if (!input.trim()) return;
  const userNorm = normalize(input);
  const ok = current.answers.some(a => normalize(a) === userNorm);

  stats.total++;
  const resultEl = document.getElementById("result");
  const answerEl = document.getElementById("answerText");

  if (ok) {
    locked = true;
    document.querySelector(".skip").disabled = true;
    setPrimaryAction("next");
    stats.correct++;
    resultEl.textContent = "✅ 正确";
    resultEl.className = "result correct";
    clearAnswerError();
    answerEl.textContent = "";
    queue.shift();
  } else {
    locked = false;
    document.querySelector(".skip").disabled = false;
    setPrimaryAction("check");
    stats.wrong++;
    if (phase === "main" && !wrongSet.has(queue[0])) {
      wrongSet.add(queue[0]);
      wrongQueue.push(queue[0]);
    }
    resultEl.textContent = "❌ 不对，再想想";
    resultEl.className = "result wrong";
    showAnswerError();
    const comparison = highlightWrongWords(input, current.answers[0]);
    answerEl.innerHTML = `<span class="answer-label">你的答案：${comparison.user}</span>` +
      `<span class="answer-label">参考答案（标红为漏写/需改）：${comparison.correct}</span>`;
  }
  updateStats();
}

function showAnswerError() {
  const input = document.getElementById("answer");
  input.classList.add("answer-wrong");
  input.setAttribute("aria-invalid", "true");
  input.style.setProperty("-webkit-appearance", "none", "important");
  input.style.setProperty("appearance", "none", "important");
  input.style.setProperty("border", "2px solid #d33", "important");
  input.style.setProperty("border-color", "#d33", "important");
  input.style.setProperty("box-shadow", "0 0 0 3px rgba(221,51,51,.16)", "important");
}

function clearAnswerError() {
  const input = document.getElementById("answer");
  input.classList.remove("answer-wrong");
  input.removeAttribute("aria-invalid");
  ["-webkit-appearance", "appearance", "border", "border-color", "box-shadow"].forEach(property => input.style.removeProperty(property));
}

function skip() {
  if (!current || locked) return;
  locked = true;
  stats.skipped++;
  document.getElementById("result").textContent = "已跳过";
  document.getElementById("result").className = "result";
  document.getElementById("answerText").textContent = "参考答案：" + current.answers[0];
  queue.shift();
  updateStats();
  document.querySelector(".skip").disabled = true;
  setPrimaryAction("next");
}

function restart(confirmed = false) {
  if (!confirmed && (stats.correct || stats.wrong || stats.skipped) &&
      !window.confirm("重新开始将清空本轮进度和答题统计，并从第一题重新开始。确定继续吗？")) return;
  resetQueue();
  document.getElementById("answer").style.display = "";
  document.getElementById("stats").textContent = "";
  nextCard();
  updateStats();
}

function changeOrder() {
  const selectedMode = document.querySelector('input[name="orderMode"]:checked').value;
  const hasProgress = stats.correct > 0 || stats.wrong > 0 || stats.skipped > 0;
  if (hasProgress && !window.confirm("切换题目顺序会重新开始本轮，当前进度和统计将清零。要继续吗？")) {
    document.querySelector(`input[name="orderMode"][value="${currentOrderMode}"]`).checked = true;
    return;
  }
  currentOrderMode = selectedMode;
  restart(true);
}

function updateStats() {
  document.getElementById("stats").textContent =
    `已提交 ${stats.total} 次：答对 ${stats.correct}，答错 ${stats.wrong}，跳过 ${stats.skipped}`;
}

document.getElementById("answer").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    if (awaitingNext) nextCard();
    else check();
  }
});

resetQueue();
nextCard();
</script>
</body>
</html>
